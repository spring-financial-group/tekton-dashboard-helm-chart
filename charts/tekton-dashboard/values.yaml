# tekton-ingress example with TLS enabled
ingress:
  host: tekton-dashboard.acme.com
  tls:
    enabled: true
    secretName: example.com
# Expose the dashboard via the Gateway API instead of (or alongside) an Ingress.
# Renders an HTTPRoute, plus an Envoy Gateway SecurityPolicy when auth is enabled.
# Requires Envoy Gateway as the Gateway API provider when auth is used.
httpRoute:
  enabled: false
  host: tekton-dashboard.acme.com
  pathPrefix: /
  annotations: {}
  # Gateways the HTTPRoute attaches to. At least one parentRef is required.
  # parentRefs:
  # - name: my-gateway
  #   namespace: gateway-system
  #   sectionName: https
  parentRefs: []
  # External authentication for the dashboard, rendered as an Envoy Gateway
  # SecurityPolicy targeting the HTTPRoute. Enable AT MOST ONE of the blocks
  # below; leave both disabled for an unauthenticated route.
  auth:
    # Delegate auth to an external service via Envoy ext_authz. Defaults target
    # the bundled oauth2-proxy (GitHub).
    # https://gateway.envoyproxy.io/latest/api/extension_types/#extauth
    extAuth:
      enabled: false
      # Auth backend. Defaults to the bundled oauth2-proxy Service
      # (<release>-oauth2-proxy) when name is left empty.
      backendRef:
        name: ""
        port: 80
      # oauth2-proxy auth endpoint Envoy calls to authorize each request.
      path: /oauth2/auth
      # Allow requests through if the auth service is unreachable.
      failOpen: false
      # Auth-response headers copied onto the request forwarded to the dashboard.
      headersToBackend:
      - x-auth-request-user
      - x-auth-request-email
      - x-auth-request-access-token
      - authorization
    # Native Envoy Gateway OIDC. oauth2-proxy is not required. Fill in your
    # provider details below.
    # https://gateway.envoyproxy.io/latest/api/extension_types/#oidc
    oidc:
      enabled: false
      # Issuer URL. authorization/token endpoints are discovered from
      # <issuer>/.well-known/openid-configuration unless overridden below.
      issuer: ""
      # authorizationEndpoint: ""
      # tokenEndpoint: ""
      # endSessionEndpoint: ""
      clientID: ""
      # Secret holding the OIDC client secret. Envoy Gateway requires the value
      # to live under the key named below (defaults to "client_secret").
      clientSecret:
        name: ""
        key: client_secret
      scopes:
      - openid
      - profile
      - email
      # Absolute callback URL. Must be a path under httpRoute.host that the
      # HTTPRoute matches; Envoy intercepts it. Defaults to
      # https://<httpRoute.host>/oauth2/callback when left empty.
      redirectURL: ""
      logoutPath: /logout
      # Forward the access token to the dashboard as a header.
      forwardAccessToken: false
      cookieConfig:
        secure: true
        httpOnly: true
        sameSite: Lax
# this is the auth host for the proxy (tekton-auth.example.com) and used to template ingress annotations for redirection
# only add an authHost if deploying oauth2-proxy
authHost:
# deploy oauth2 proxy as a dependency with tekton-dashboard-helm-chart to manage authorisation with GitHub
# add clientID, clientSecret, cookieSecret or use existingSecret to attach to a secret
oauth2-proxy:
  # enable or disable oauth2-proxy: default = false
  enabled: false
  config:
    clientID: your-githubClient
    clientSecret: your-githubSecret
    #   cookieSecret: your-cookieSecret
    #   existingSecret: test # enter secret name here
  extraArgs:
    provider: github
    # scope user:email (fix for version 6.13.1 Github issues)
    scope: user:email
    github-org: your-org
    cookie-domain: .example.com
    whitelist-domain: .example.com
  ingress:
    enabled: true
    path: /oauth2
    pathType: Prefix
    className: nginx
    annotations:
      acme.cert-manager.io/http01-edit-in-place: "true"
      # add or remove cert manger dependent on use case. Add clusterIssuer lets-encrypt below
      cert-manager.io/cluster-issuer: letsencrypt-yourEnv
      kubernetes.io/tls-acme: "true"
    hosts:
      - example.com
    tls:
      - hosts:
          - example.com
        secretName: example.com
# args passed to the dashboard container
args:
  default-namespace: ""
  external-logs: ""
  log-format: json
  log-level: info
  logout-url: ""
  namespaces: ""
  pipelines-namespace: tekton-pipelines
  port: "9097"
  read-only: "true"
  stream-logs: "true"
  triggers-namespace: tekton-pipelines
