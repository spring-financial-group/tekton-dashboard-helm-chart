# tekton-ingress example with TLS enabled
ingress:
  enabled: true
  host: tekton-dashboard.acme.com
  tls:
    enabled: true
    secretName: example.com
httpRoute:
  enabled: false
  host: tekton-dashboard.acme.com
  pathPrefix: /
  annotations: {}
  # Gateways the HTTPRoute attaches to. At least one parentRef is required
  # when enabled. namespace and sectionName are optional.
  # parentRefs:
  # - name: my-gateway
  #   namespace: gateway-system
  #   sectionName: https
  parentRefs: []
# this is the auth host for the proxy (tekton-auth.example.com) and used to template ingress annotations for redirection
# only add an authHost if deploying oauth2-proxy
authHost:
# deploy oauth2 proxy as a dependency with tekton-dashboard-helm-chart to manage authorisation with GitHub
# add clientID, clientSecret, cookieSecret or use existingSecret to attach to a secret
oauth2-proxy:
  # enable or disable oauth2-proxy: default = false
  enabled: false
  config:
    clientID: your-githubClient
    clientSecret: your-githubSecret
    #   cookieSecret: your-cookieSecret
    #   existingSecret: test # enter secret name here
  extraArgs:
    provider: github
    # scope user:email (fix for version 6.13.1 Github issues)
    scope: user:email
    github-org: your-org
    cookie-domain: .example.com
    whitelist-domain: .example.com
  apiGateway:
    enabled: false
    # Gateway the oauth2-proxy HTTPRoute attaches to.
    # namespace and sectionName are optional.
    # gatewayRef:
    #   name: my-gateway
    #   namespace: gateway-system
    #   sectionName: https
    gatewayRef: {}
    rules:
    - name: tekton-dashboard
      matches:
      - path:
          type: PathPrefix
          value: /
    hostnames:
    - example.com
    # Additional labels to add to the HTTPRoute
    labels: {}
    # Additional annotations to add to the HTTPRoute
    annotations: {}
  ingress:
    enabled: true
    path: /oauth2
    pathType: Prefix
    className: nginx
    annotations:
      acme.cert-manager.io/http01-edit-in-place: "true"
      # add or remove cert manger dependent on use case. Add clusterIssuer lets-encrypt below
      cert-manager.io/cluster-issuer: letsencrypt-yourEnv
      kubernetes.io/tls-acme: "true"
    hosts:
      - example.com
    tls:
      - hosts:
          - example.com
        secretName: example.com
# args passed to the dashboard container
args:
  default-namespace: ""
  external-logs: ""
  log-format: json
  log-level: info
  logout-url: ""
  namespaces: ""
  pipelines-namespace: tekton-pipelines
  port: "9097"
  read-only: "true"
  stream-logs: "true"
  triggers-namespace: tekton-pipelines
