# Expose the dashboard via EITHER ingress OR httpRoute (not both). See README for the
# supported dashboard/oauth2-proxy exposure combinations.
# tekton-ingress example with TLS enabled
ingress:
  enabled: true
  host: tekton-dashboard.acme.com
  tls:
    enabled: true
    secretName: example.com
httpRoute:
  enabled: false
  host: tekton-dashboard.acme.com
  pathPrefix: /
  annotations: {}
  # Gateways the HTTPRoute attaches to. At least one parentRef is required
  #
  # parentRefs:
  # - name: my-gateway
  #   namespace: gateway-system
  #   sectionName: https
  parentRefs: []
  # External authentication for the HTTPRoute, delegated to a provider-specific resource
  # This is the equivalent of the nginx auth-url/auth-signin annotations
  auth:
    enabled: false # Leave disabled when routing without auth, or when auth is enforced outside this chart
    # Provider that renders the in-chart auth resource
    provider: envoyGateway # Only "envoyGateway" is supported for now
    # Auth backend. Defaults to bundled oauth2-proxy Service
    backend:
      serviceName: ""
      port: 80
    # envoyGateway settings
    envoyGateway:
      authPath: /oauth2/auth
      failOpen: false
      # headers the auth backend returns that are forwarded to the dashboard
      headersToBackend:
      - x-auth-request-user
      - x-auth-request-email
      - x-auth-request-access-token
      - authorization
# this is the auth host for the proxy (tekton-auth.example.com) and used to template ingress annotations for redirection
# only add an authHost if deploying oauth2-proxy
authHost:
# deploy oauth2 proxy as a dependency with tekton-dashboard-helm-chart to manage authorisation with GitHub
# add clientID, clientSecret, cookieSecret or use existingSecret to attach to a secret
oauth2-proxy:
  # enable or disable oauth2-proxy: default = false
  enabled: false
  config:
    clientID: your-githubClient
    clientSecret: your-githubSecret
    #   cookieSecret: your-cookieSecret
    #   existingSecret: test # enter secret name here
  extraArgs:
    provider: github
    # scope user:email (fix for version 6.13.1 Github issues)
    scope: user:email
    github-org: your-org
    cookie-domain: .example.com
    whitelist-domain: .example.com
  # Expose sign-in and callback endpoints via Gateway API.
  gatewayApi:
    enabled: false
    # Gateway the oauth2-proxy HTTPRoute attaches to. Should match
    # httpRoute.parentRefs[0]. namespace and sectionName are optional.
    # gatewayRef:
    #   name: my-gateway
    #   namespace: gateway-system
    #   sectionName: https
    gatewayRef: {}
    # Route only the /oauth2 prefix to oauth2-proxy. The backendRef defaults to the
    # oauth2-proxy Service, so it does not need to be specified here.
    rules:
    - matches:
      - path:
          type: PathPrefix
          value: /oauth2
    # Must match httpRoute.host so /oauth2/* lives alongside the dashboard.
    hostnames:
    - example.com
    # Additional labels to add to the HTTPRoute
    labels: {}
    # Additional annotations to add to the HTTPRoute
    annotations: {}
  # Expose sign-in and callback endpoints via Ingress
  ingress:
    enabled: true
    path: /oauth2
    pathType: Prefix
    className: nginx
    annotations:
      acme.cert-manager.io/http01-edit-in-place: "true"
      # add or remove cert manger dependent on use case. Add clusterIssuer lets-encrypt below
      cert-manager.io/cluster-issuer: letsencrypt-yourEnv
      kubernetes.io/tls-acme: "true"
    # Must match httpRoute.host so /oauth2/* lives alongside the dashboard.
    hosts:
      - example.com
    tls:
      - hosts:
          - example.com
        secretName: example.com
# args passed to the dashboard container
args:
  default-namespace: ""
  external-logs: ""
  log-format: json
  log-level: info
  logout-url: ""
  namespaces: ""
  pipelines-namespace: tekton-pipelines
  port: "9097"
  read-only: "true"
  stream-logs: "true"
  triggers-namespace: tekton-pipelines
